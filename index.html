<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velvet Sky · a quiet flight</title><link rel="stylesheet" href="src/style.css"></head>
<body><canvas id="sky" aria-label="Velvet Sky: an interactive flight through clouds above fictional farmland"></canvas>
<button id="toggle" aria-label="Flight settings" title="Flight settings" aria-expanded="true" aria-controls="panel"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h3m4 0h9M4 12h9m4 0h3M4 18h3m4 0h9"/><path d="M7 3v6m10 0v6m-10 0v6"/></svg></button>
<aside id="panel" aria-label="Flight settings">
<label>Altitude <output id="altitude-value"></output><input id="altitude" type="range" min="200" max="6096" step="1" value="2900"></label>
<label>Cruising speed <output id="speed-value"></output><input id="speed" type="range" min="0" max="500" value="65"></label>
<label>Cloud cover <output id="cover-value"></output><input id="cover" type="range" min="0" max="100" value="42"></label>
<label>Cloud character<select id="cloud"><option value="0">Fair-weather cumulus</option><option value="1">High, feathered cirrus</option><option value="2">Soft layered stratus</option><option value="3">Storm towers · cumulonimbus</option></select></label>
<label>Time of day <output id="hour-value"></output><input id="hour" type="range" min="0" max="24" step="0.05" value="17.6"></label>
<label>Time progression<select id="timeFrozen"><option value="1">Frozen</option><option value="0">Running</option></select></label>
<label>Time rate <output id="timeRate-value"></output><input id="timeRate" type="range" min="0.1" max="120" step="0.1" value="1"></label>
<label>Moon<select id="moon"><option value="0">Off</option><option value="1">Crescent</option><option value="2">Half</option><option value="3">Full</option></select></label>
<label>Solar eclipse<select id="eclipse"><option value="0">Off</option><option value="1">Total eclipse</option><option value="2">Annular eclipse</option></select></label>
<label id="eclipse-controls" hidden>Eclipse progress <output id="eclipseProgress-value"></output><input id="eclipseProgress" type="range" min="0" max="100" value="50"></label>
<label>Rendering <output id="performance-value" aria-live="off"></output><select id="rendering"><option value="-1">Power saving · 30 FPS</option><option value="0">Smooth · auto resolution</option><option value="0.65">Smooth · reduced resolution</option><option value="0.9">Smooth · balanced</option><option value="1.25">Smooth · fine detail</option></select></label>
<div class="actions"><button id="forward">Look forward</button><button id="pause" aria-pressed="false">Pause</button><button id="fullscreen" aria-label="Toggle fullscreen">⛶</button></div>
<div class="vr-actions"><button id="enter-vr" disabled>Checking VR…</button><p id="vr-status" role="status"></p></div>
</aside>
<div id="error" role="alert" hidden></div><script type="module" src="src/main.js"></script></body></html>
